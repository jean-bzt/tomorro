        description: "Organization ID"
        tests:
          - not_null
          - unique

      - name: nb_contract_created
        description: "Number of contracts created"

      - name: first_contract_created_at
        description: "Date of first contract created"

      - name: last_contract_created_at
        description: "Date of last contract created"
